rules:
 # highest override
 - DOMAIN,test.steampowered.net,🎮 Steam test
 # local direct
 - RULE-SET,lancidr,DIRECT,no-resolve
 - RULE-SET,private,DIRECT,no-resolve

 # custom rules
 - DOMAIN-SUFFIX,linkedin.cn,REJECT # reject linkedin cn
 # - DOMAIN-SUFFIX,gamersky.com,🇨🇳 China # proxy gamersky to china
 - DST-PORT,25565,DIRECT # minecraft server direct
 - RULE-SET,FuckAdobe_domain,🛑 REJECT

 # telegram group
 - RULE-SET,telegramcidr,📲 Telegram

 # bahamut group
 - RULE-SET,Bahamut_domain,📺 Bahamut

 # ncm group
 - RULE-SET,Netease_Cloud_Music,🎵 NCM
 - DOMAIN,admusicpic.music.126.net,REJECT
